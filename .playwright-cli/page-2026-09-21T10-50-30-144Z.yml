  - heading "Seven primitives" [level=2] [ref=e23]
  - paragraph [ref=e24]: It replaces an 85k-line Node/Express/MongoDB backend whose nine ported domains became roughly 1,700 lines of scripts, with almost nothing leaking back into Go.
