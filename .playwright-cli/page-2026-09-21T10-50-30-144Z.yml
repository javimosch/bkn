  - heading "What gets in" [level=2] [ref=e105]
  - strong [ref=e107]: Admit a primitive that removes a class of application code from every embedder. Refuse a query feature that only moves application code into bkn.
  - paragraph [ref=e108]:
    - text: bkn should make a complex system
    - emphasis [ref=e109]: smaller
    - text: ", not merely possible. The bar is not “could this app run on bkn” but “would this app be"
    - emphasis [ref=e110]: less code
    - text: on bkn”. An application bkn cannot serve is a gap to close, not a boundary to defend — and the failure mode that rule guards against is this project’s own origin, a core that grew to 85k lines because every need became a feature.
  - paragraph [ref=e111]:
    - text: Fit-checked against a 131k-line control plane, three primitives took it from 33 statements beyond the store’s surface to
    - strong [ref=e112]: "11"
    - text: — and all 11 were refused rather than absorbed. The core grew by three primitives and no query language.
  - heading "The contract is the product" [level=2] [ref=e113]
  - paragraph [ref=e114]:
    - text: A clean-room reimplementation in another language,
    - link "machin-bkn" [ref=e115] [cursor=pointer]:
      - /url: https://github.com/javimosch/machin-bkn
    - text: ", passes the same"
    - strong [ref=e116]: 113-assertion live suite
    - text: ", unmodified. The contract is portable, not a description of one codebase. When bkn stops being useful what remains is a"
    - code [ref=e117]: .db
    - text: file of plain JSON documents and a directory of ordinary JavaScript — nothing has to be migrated off, because nothing was ever locked in.
