    - heading "bkn" [level=1] [ref=e5]
    - paragraph [ref=e6]: A backend you own, small enough to read, that outlives the tool that wrote it. Documents, settings, identity, files, an event log, a scheduler and signed webhooks — over one embedded SQLite file. No database server, no runtime to install, no dashboard, no account.
