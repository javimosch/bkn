      - generic [ref=e29]: six verbs, one sort field, a total
      - paragraph [ref=e30]: Collections of JSON documents with normalization declared on the collection, atomic update operators under compare-and-set, preconditions, self-bounding retention and grouped counts.
    - generic [ref=e31]:
      - generic [ref=e32]: kv
