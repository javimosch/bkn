  - generic [ref=e70]: "bkn store create myapp/users --normalize email=trim_lower bkn store put myapp/users --data '{\"email\":\" Ada@Example.IO \",\"name\":\"Ada\"}' bkn store find myapp/users --where email=ADA@EXAMPLE.IO # normalized on both sides # operators are computed from the current value, under compare-and-set bkn store patch myapp/runs r1 --data '{\"tries\":{\"$inc\":1},\"log\":{\"$append\":\"started\\n\"}}' bkn store patch myapp/runs r1 --data '{\"worker\":\"w1\"}' --if-absent worker # the collection bounds itself — no trim query, no schedule bkn store create app/memories --retain-last 20 --retain-per tag,repo_id export BKN_ENCRYPTION_KEY=$(openssl rand -hex 32) bkn kv set myapp.stripe sk_live_xxx --type encrypted bkn script create waitlist-digest --file digest.js bkn cron create nightly --schedule \"0 3 * * *\" --script waitlist-digest bkn daemon start # the same primitives over HTTP curl -s localhost:7799/_health"
  - heading "What it deliberately will not do" [level=2] [ref=e71]
  - paragraph [ref=e72]: Each of these was asked for by a real codebase and refused on purpose. Refusing is how the admission rule earns its keep — a rule that only ever admits is not a rule.
