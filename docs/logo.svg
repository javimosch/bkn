<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="bkn">
  <title>bkn</title>
  <!-- A letterpress type sort: a small block that prints something readable
       and outlives the press. Carries its own paper so it reads on a light or
       a dark page. Palette and rules match the docs site. -->
  <rect x="8" y="8" width="496" height="496" rx="44" fill="#fbf6e9"/>
  <rect x="8" y="8" width="496" height="496" rx="44" fill="none" stroke="#24221d" stroke-width="16"/>
  <rect x="40" y="40" width="432" height="432" rx="22" fill="none" stroke="#24221d" stroke-width="4" opacity=".38"/>

  <!-- the sort, three-quarter view -->
  <g>
    <!-- printing face (shoulder), catching the light -->
    <path d="M256 128 L392 200 L256 272 L120 200 Z" fill="#c88a16"/>
    <path d="M256 128 L392 200 L256 272 L120 200 Z" fill="none" stroke="#24221d" stroke-width="12" stroke-linejoin="round"/>
    <!-- body, left face -->
    <path d="M120 200 L256 272 L256 400 L120 328 Z" fill="#24221d"/>
    <!-- body, right face -->
    <path d="M392 200 L392 328 L256 400 L256 272 Z" fill="#3c372e"/>
    <path d="M120 200 L256 272 L256 400 L120 328 Z M392 200 L392 328 L256 400 L256 272 Z"
          fill="none" stroke="#24221d" stroke-width="12" stroke-linejoin="round"/>
    <!-- the nick: the groove a compositor finds by touch, so a sort is
         identified without being read -->
    <path d="M150 268 L226 308" fill="none" stroke="#fbf6e9" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
